name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - claude/score-board-premium-app-l30088
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/gcp-key.json"

      - name: Deploy Firestore rules + Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          # Public Firebase web config (safe to expose, needed at Next.js build time).
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyClTAORnFKWtP1ou1Ge1kLSGod72IpubVU"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "jeux-de-cartes-a34f7.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "jeux-de-cartes-a34f7"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "jeux-de-cartes-a34f7.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "442638459103"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:442638459103:web:bca2fcf972dba188ca896a"
        run: npx firebase-tools deploy --only firestore:rules,hosting --project jeux-de-cartes-a34f7 --non-interactive
